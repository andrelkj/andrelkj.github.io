name: Tests

on:
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Regenerate visual baselines (uploaded as the visual-baselines artifact, not committed)
        type: boolean
        default: false
      repeat_each:
        description: Run every test this many times (flake check in the CI container)
        type: number
        default: 1

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with @playwright/test in package.json; the first step fails if they drift.
  PLAYWRIGHT_VERSION: 1.63.0

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      - name: Check Playwright version matches the container
        run: |
          installed=$(node -p "require('@playwright/test/package.json').version")
          if [ "$installed" != "$PLAYWRIGHT_VERSION" ]; then
            echo "::error::@playwright/test is $installed but the container is $PLAYWRIGHT_VERSION"
            exit 1
          fi

      - name: Static checks (typecheck, lint, format)
        run: npm run check

      - name: Run Playwright tests
        env:
          REPEAT_EACH: ${{ inputs.repeat_each || 1 }}
          UPDATE_FLAG: ${{ inputs.update_snapshots && '--update-snapshots' || '' }}
        run: npx playwright test --repeat-each="$REPEAT_EACH" $UPDATE_FLAG

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # New or regenerated visual baselines (Linux, this container). Download, review the images,
      # then commit them: baselines are never committed by CI itself.
      - name: Upload visual baselines
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: tests/specs/visual.spec.ts-snapshots/*-linux.png
          if-no-files-found: ignore
          retention-days: 14

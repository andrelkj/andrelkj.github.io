name: Mutation

# Proves the suite catches real defects: applies every mutant in scripts/mutate/mutants.ts to a
# copy of the site and checks the intended tests fail. Writes docs/TRUST.md as an artifact for a
# person to review and commit; CI never commits it.
on:
  pull_request:
    paths:
      - index.html
      - styles.css
      - script.js
      - assets/**
      - tests/**
      - scripts/mutate/**
      - playwright.config.ts
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      # Same image as tests.yml: the visual mutants need the Linux baselines.
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      # git in the container refuses a checkout owned by another user; the runner needs the SHA.
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run all mutants
        run: npm run mutate -- --write

      - name: Upload trust scorecard
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: trust-scorecard
          path: docs/TRUST.md
          if-no-files-found: ignore
          retention-days: 30
